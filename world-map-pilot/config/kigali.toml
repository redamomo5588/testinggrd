# Pilot area of interest. bbox = [min_lon, min_lat, max_lon, max_lat] (EPSG:4326)
name = "kigali"
bbox = [29.98, -2.02, 30.18, -1.89]
resolution_m = 10            # master grid cell size (UTM, auto zone)

[overture]
release = "2026-09-23.1"

[rules]
forest_min_canopy_m = 5.0     # FAO-style height threshold
water_min_occurrence_pct = 50 # JRC GSW occurrence threshold
floor_height_m = 3.0          # height estimate when only num_floors is known
water_point_dedupe_m = 30.0   # merge water points closer than this

[wpdx]
# Optional: Water Point Data Exchange export (CSV with lat_deg, lon_deg columns).
# Leave empty to skip. API: https://data.waterpointdata.org/resource/eqje-vguj.csv
csv = ""
